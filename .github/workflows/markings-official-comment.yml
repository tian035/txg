name: collect-authentic-markings-images

on:
  issue_comment:
    types: [created]

jobs:
  collect:
    if: contains(github.event.comment.body, 'run-authentic-markings')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python collect_markings_official.py
      - uses: actions/upload-artifact@v4
        with:
          name: authentic-markings-images
          path: markings_official
