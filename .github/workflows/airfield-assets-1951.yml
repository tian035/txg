name: collect-airfield-assets-1951

on:
  push:
    branches: [main]
    paths:
      - collect_airfield_assets_1951.py
      - .github/workflows/airfield-assets-1951.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Collect and verify images
        run: python collect_airfield_assets_1951.py
      - name: Package files
        run: zip -r airfield-assets-1951.zip airfield_assets_1951
      - uses: actions/upload-artifact@v4
        with:
          name: airfield-assets-1951
          path: airfield-assets-1951.zip
          retention-days: 7
