name: collect-airfield-direct-fast

on:
  push:
    branches: [main]
    paths:
      - collect_airfield_direct_fast.py
      - .github/workflows/airfield-direct-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pillow
      - name: Download and validate
        run: python collect_airfield_direct_fast.py
      - name: Package
        run: zip -r airfield-direct-fast.zip airfield_direct_fast
      - uses: actions/upload-artifact@v4
        with:
          name: airfield-direct-fast
          path: airfield-direct-fast.zip
          retention-days: 7
