name: collect-selected-images-corrected

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  collect:
    if: contains(github.event.comment.body, 'RUN_COLLECT_CORRECTED')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python collect_corrected.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-image-artifact-corrected
          path: selected_artifact
          compression-level: 6
