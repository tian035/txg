name: scrape-image-sources

on:
  workflow_dispatch:
  push:
    paths:
      - "scrape.py"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Run scraper
        run: python scrape.py
      - name: Commit collected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scrape_artifact
          git commit -m "Collect source images" || exit 0
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrape-artifact
          path: scrape_artifact
